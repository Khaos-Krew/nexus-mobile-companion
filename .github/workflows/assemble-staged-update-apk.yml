name: Assemble staged signed update APK

on:
  push:
    branches: [release/preview-0.2.3-update]
    paths:
      - updates/staging/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="updates/preview/Khaos-Nexus-Mobile-Companion-current.apk"
          cat updates/staging/chunk-*.b64 | tr -d '\n\r' | base64 --decode > "$OUTPUT"
          echo "393418fd9e53ca91d9ffadbc64bd863acab270aaf0cd2994fe85db409d5abed1  $OUTPUT" | sha256sum --check --strict
          test "$(stat -c '%s' "$OUTPUT")" = "86794"

      - name: Commit immutable channel APK and remove staging data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf updates/staging
          rm .github/workflows/assemble-staged-update-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(update): publish stable-signed 0.2.3 channel APK"
          git push origin HEAD:release/preview-0.2.3-update
